[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# School defaults are set in the Netlify UI (Site configuration > Environment variables), not here:
#   VITE_SCHOOL_NAME, VITE_SCHOOL_PHONE, VITE_ADMIN_PHONE, VITE_HOSPITAL_NAME, VITE_HOSPITAL_PHONE,
#   VITE_RESERVATION_API_URL
# Never add a Gemini key or personal phone numbers: VITE_* values are public in the bundle.
# Server-only secret (functions, never VITE_*): KOSHA_API_KEY for netlify/functions/msds.mjs
