[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# School defaults are set in the Netlify UI (Site configuration > Environment variables), not here:
#   VITE_SCHOOL_NAME, VITE_SCHOOL_PHONE, VITE_ADMIN_PHONE, VITE_HOSPITAL_NAME, VITE_HOSPITAL_PHONE,
#   VITE_RESERVATION_API_URL
# Never add a Gemini key or personal phone numbers: VITE_* values are public in the bundle.
# Server-only secrets (functions, never VITE_*, mark "Contains secret values"):
#   KOSHA_API_KEY  netlify/functions/msds.mjs  (data.go.kr, Decoding key)
#   GEMINI_API_KEY netlify/functions/ai.mjs    (Google AI Studio)
#   ADMIN_PIN      netlify/functions/admin.mjs (admin settings / inspection pages)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Apps Script answers from script.googleusercontent.com after a redirect; QR labels are data: images.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
